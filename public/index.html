<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00243d" />
    <meta
      name="description"
      content="Mera Software helps businesses go online with website development, mobile apps, custom software, and digital marketing. Build your brand and grow your business with simple and effective solutions."
    />
    <!-- Favicon + app icons are the website's "M" (written by merasoftware `npm run brand`). -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Mera Software</title>
    <script>
      // Apply the saved portal theme and accent before first paint so the page
      // never flashes the default and then repaint. Mirrors DEFAULT_THEME/THEMES
      // and DEFAULT_ACCENT/ACCENTS in src/context/ThemeContext.js — keep them in step.
      (function () {
        var accents = ['cyan', 'red', 'green', 'purple', 'yellow', 'orange', 'magenta', 'pink'];
        var t = 'light';
        var a = 'cyan';
        try {
          t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark' && t !== 'immersive') t = 'light';
          a = localStorage.getItem('accent');
          if (accents.indexOf(a) === -1) a = 'cyan';
        } catch (e) {
          t = 'light';
          a = 'cyan';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-accent', a);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Boot loader: shows while the app script downloads; React replaces it on its first render.
         Same mark as src/components/Spinner.js (lucide Loader2), styled by .portal-spinner in src/index.css. -->
    <div id="root"><div class="portal-surface portal-boot" role="status" aria-label="Loading"><svg class="portal-spinner portal-spinner--accent" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
